<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for the Shield -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="50%" stop-color="#d9ecf8"/>
      <stop offset="100%" stop-color="#cbe3f5"/>
    </linearGradient>

    <!-- Flame / Obor Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <!-- Path for curved text SMA NEGERI -->
    <path id="textArcSma" d="M 105 82 Q 200 50 295 82" fill="none"/>
    <!-- Path for curved text AJI AJEN ANORAGA -->
    <path id="textArcMotto" d="M 125 388 Q 200 422 275 388" fill="none"/>
  </defs>

  <!-- Main Shield Outer Outer Frame -->
  <path d="M 200 24 C 290 24 336 48 340 160 C 344 265 305 348 200 395 C 95 348 56 265 60 160 C 64 48 110 24 200 24 Z" 
        fill="#1e293b" />

  <!-- Shield Outer White Rim -->
  <path d="M 200 28 C 285 28 330 50 334 160 C 338 260 300 342 200 388 C 100 342 62 260 66 160 C 70 50 115 28 200 28 Z" 
        fill="#ffffff" />

  <!-- Shield Inner Body -->
  <path d="M 200 36 C 280 36 322 56 326 160 C 330 254 294 334 200 378 C 106 334 70 254 74 160 C 78 56 120 36 200 36 Z" 
        fill="url(#shieldBg)" 
        stroke="#334155" 
        stroke-width="2.5" />

  <!-- Inner Fine Outline -->
  <path d="M 200 44 C 274 44 314 62 318 160 C 322 248 288 325 200 368 C 112 325 78 248 82 160 C 86 62 126 44 200 44 Z" 
        fill="none" 
        stroke="#64748b" 
        stroke-width="1.2" 
        stroke-dasharray="4,2" />

  <!-- Globe / Longitude-Latitude Grid at Bottom Base -->
  <g stroke="#64748b" stroke-width="1.8" fill="none" opacity="0.85">
    <!-- Horizontal parallels -->
    <path d="M 120 335 C 160 355 240 355 280 335" />
    <path d="M 106 305 C 150 330 250 330 294 305" />
    <!-- Vertical meridians radiating down -->
    <line x1="200" y1="290" x2="200" y2="376" stroke-width="2" />
    <line x1="172" y1="295" x2="160" y2="370" />
    <line x1="228" y1="295" x2="240" y2="370" />
    <line x1="145" y1="300" x2="126" y2="355" />
    <line x1="255" y1="300" x2="274" y2="355" />
    <line x1="120" y1="310" x2="98" y2="338" />
    <line x1="280" y1="310" x2="302" y2="338" />
  </g>

  <!-- Top Text: SMA NEGERI -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" fill="#1e293b" letter-spacing="4.5">
    <textPath href="#textArcSma" startOffset="50%" text-anchor="middle">
      SMA NEGERI
    </textPath>
  </text>

  <!-- Sunburst Rays behind Flame & Wings -->
  <g stroke="#facc15" stroke-width="2.5" opacity="0.9">
    <line x1="200" y1="130" x2="200" y2="70" />
    <line x1="200" y1="130" x2="175" y2="75" />
    <line x1="200" y1="130" x2="225" y2="75" />
    <line x1="200" y1="130" x2="152" y2="88" />
    <line x1="200" y1="130" x2="248" y2="88" />
    <line x1="200" y1="130" x2="135" y2="108" />
    <line x1="200" y1="130" x2="265" y2="108" />
    <line x1="200" y1="130" x2="125" y2="132" />
    <line x1="200" y1="130" x2="275" y2="132" />
  </g>

  <!-- Wings Left -->
  <g fill="url(#wingGrad)" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round">
    <!-- Feather 1 (Top) -->
    <path d="M 185 140 C 160 115 130 90 105 105 C 120 120 145 135 175 148 Z" />
    <!-- Feather 2 -->
    <path d="M 182 148 C 150 128 115 112 98 128 C 115 140 140 152 170 160 Z" />
    <!-- Feather 3 -->
    <path d="M 178 158 C 145 142 105 135 95 152 C 115 160 140 168 168 172 Z" />
    <!-- Feather 4 -->
    <path d="M 172 168 C 140 158 102 160 98 178 C 118 180 142 182 165 184 Z" />
    <!-- Feather 5 (Bottom) -->
    <path d="M 166 178 C 140 175 110 185 108 200 C 125 198 145 195 165 192 Z" />
  </g>

  <!-- Wings Right -->
  <g fill="url(#wingGrad)" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round">
    <!-- Feather 1 (Top) -->
    <path d="M 215 140 C 240 115 270 90 295 105 C 280 120 255 135 225 148 Z" />
    <!-- Feather 2 -->
    <path d="M 218 148 C 250 128 285 112 302 128 C 285 140 260 152 230 160 Z" />
    <!-- Feather 3 -->
    <path d="M 222 158 C 255 142 295 135 305 152 C 285 160 260 168 232 172 Z" />
    <!-- Feather 4 -->
    <path d="M 228 168 C 260 158 298 160 302 178 C 282 180 258 182 235 184 Z" />
    <!-- Feather 5 (Bottom) -->
    <path d="M 234 178 C 260 175 290 185 292 200 C 275 198 255 195 235 192 Z" />
  </g>

  <!-- Flame of Knowledge / Obor Api (Pendidikan) -->
  <!-- Outer Flame -->
  <path d="M 200 68 
           C 208 85 218 95 226 108 
           C 236 122 232 140 220 152 
           C 214 142 216 130 210 122 
           C 206 130 204 140 196 148 
           C 188 138 186 126 182 118 
           C 176 130 170 142 180 152 
           C 168 140 164 122 174 108 
           C 182 95 192 85 200 68 Z" 
        fill="url(#flameGrad)" 
        stroke="#991b1b" 
        stroke-width="1.5" />

  <!-- Inner Flame Core -->
  <path d="M 200 85 
           C 205 98 212 108 215 118 
           C 218 128 212 138 205 145 
           C 202 138 203 130 200 125 
           C 197 130 198 138 195 145 
           C 188 138 182 128 185 118 
           C 188 108 195 98 200 85 Z" 
        fill="url(#flameInner)" />

  <!-- Central Torch Base / Silhouette Head -->
  <path d="M 188 145 C 188 132 212 132 212 145 C 212 162 218 178 222 195 L 178 195 C 182 178 188 162 188 145 Z" 
        fill="#475569" 
        stroke="#1e293b" 
        stroke-width="1.5" />

  <!-- Open Book Base (Buku Terbuka) -->
  <g stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M 200 200 C 175 190 145 192 120 205 L 122 250 C 147 238 177 236 200 246 Z" 
          fill="#ffffff" />
    <!-- Right Page -->
    <path d="M 200 200 C 225 190 255 192 280 205 L 278 250 C 253 238 223 236 200 246 Z" 
          fill="#ffffff" />
    
    <!-- Central Spine -->
    <line x1="200" y1="200" x2="200" y2="246" stroke="#1e293b" stroke-width="3" />
  </g>

  <!-- Number 19 Center Box & Text -->
  <g>
    <!-- Dark Capsule for 19 -->
    <path d="M 152 214 L 248 214 L 242 248 L 158 248 Z" 
          fill="#ffffff" 
          stroke="#1e293b" 
          stroke-width="3" />
    
    <!-- Top & Bottom Trim of the 19 badge -->
    <line x1="146" y1="214" x2="254" y2="214" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="152" y1="248" x2="248" y2="248" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Number 19 text -->
    <text x="200" y="242" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#0f172a" 
          letter-spacing="2">
      19
    </text>
  </g>

  <!-- BANDUNG Text -->
  <text x="200" y="278" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="18" 
        font-weight="900" 
        fill="#1e293b" 
        letter-spacing="3.5">
    BANDUNG
  </text>

  <!-- Motto Ribbon Banner: AJI AJEN ANORAGA -->
  <g>
    <!-- Ribbon Shadow/Under fold left & right -->
    <path d="M 98 348 L 125 340 L 128 375 L 102 380 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8" />
    <path d="M 302 348 L 275 340 L 272 375 L 298 380 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="1.8" />

    <!-- Main Front Ribbon -->
    <path d="M 106 348 
             C 150 328 250 328 294 348 
             L 282 392 
             C 240 372 160 372 118 392 Z" 
          fill="url(#ribbonGrad)" 
          stroke="#1e293b" 
          stroke-width="2.2" />

    <!-- Motto Text along arc -->
    <text font-family="'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="13" fill="#0f172a" letter-spacing="2">
      <textPath href="#textArcMotto" startOffset="50%" text-anchor="middle">
        AJI AJEN ANORAGA
      </textPath>
    </text>
  </g>

  <!-- Bottom School Name Label Badge -->
  <g transform="translate(0, 420)">
    <!-- Lime green accent backing (as in the uploaded design) -->
    <rect x="52" y="6" width="296" height="42" rx="10" fill="#84cc16" />
    <!-- Main Off-White Text Card -->
    <rect x="40" y="0" width="300" height="40" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
    
    <text x="190" y="26" 
          text-anchor="middle" 
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="20" 
          font-weight="800" 
          fill="#1e293b" 
          letter-spacing="1">
      SMAN 19 Bandung
    </text>
  </g>
</svg>
